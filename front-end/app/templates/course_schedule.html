<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Schedule Setup - Student System</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo1.png') }}?v=20260521">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/favicon.js') }}" defer></script>
    <style>
        /* Swapped desktop styles */
        .schedule-container {
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        .schedule-left-form {
            flex: 1;
            background: #ff6b35;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .schedule-left-form::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(38, 18, 4, 0.22) 1px, transparent 1px),
                linear-gradient(90deg, rgba(38, 18, 4, 0.22) 1px, transparent 1px);
            background-size: 42px 42px;
            opacity: 0.24;
            animation: gridPulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        .schedule-right-strips {
            flex: 1;
            background: #ffd7bf;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }



        .course-row-card {
            background: rgba(255, 231, 216, 0.45);
            border: 1px solid rgba(42, 20, 6, 0.25);
            border-radius: 12px;
            padding: 20px 72px 20px 20px;
            margin-bottom: 24px;
            position: relative;
            isolation: isolate;
            box-shadow: 0 8px 16px rgba(42, 20, 6, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .course-row-card:hover {
            box-shadow: 0 12px 24px rgba(42, 20, 6, 0.08);
            transform: translateY(-2px);
        }

        .course-row-card select option {
            background: #ffd7bf;
            color: #2a1406;
        }

        /* Make time fields look more professional */
        .course-row-card .time-input-wrapper select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(42, 20, 6, 0.35);
            border-radius: 10px;
            background: rgba(255, 215, 191, 0.75);
            color: #2a1406;
            font-size: 14px;
            font-weight: 650;
            letter-spacing: 0.02em;
            outline: none;
            box-shadow: 0 10px 22px -18px rgba(42, 20, 6, 0.55);
            appearance: none;
        }

        .course-row-card .time-input-wrapper select:focus {
            border-color: rgba(42, 20, 6, 0.75);
            box-shadow: 0 0 0 3px rgba(255, 215, 191, 0.35), 0 14px 26px -20px rgba(42, 20, 6, 0.7);
        }

        .course-row-card .time-input-wrapper {
            border-bottom: none;
        }

        .course-row-card .invalid-wrapper input,
        .course-row-card .invalid-wrapper select {
            border-color: rgba(138, 43, 226, 0.7) !important;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.12) !important;
        }

        .course-row-card .overlap-invalid input,
        .course-row-card .overlap-invalid select {
            border-color: rgba(138, 43, 226, 0.7) !important;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.12) !important;
        }

        .remove-course-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.2);
            font-size: 16px;
            color: #8a2be2;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 999;
            line-height: 1;
            touch-action: manipulation;
        }

        .remove-course-btn::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 999px;
        }

        .remove-course-btn:hover {
            background: #8a2be2;
            color: #fff;
            transform: scale(1.1);
        }

        .max-courses-message {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(42, 20, 6, 0.35);
            background: rgba(255, 215, 191, 0.65);
            color: #2a1406;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .error-overlap {
            display: block;
            margin-top: -6px;
            margin-bottom: 12px;
        }

        .days-checklist {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .day-checkbox-label {
            cursor: pointer;
        }

        .day-checkbox-label input {
            display: none;
        }

        .day-checkbox-label span {
            display: inline-block;
            padding: 8px 14px;
            background: #ffd7bf;
            color: #2a1406;
            border: 1px solid rgba(42, 20, 6, 0.35);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            user-select: none;
        }

        .day-checkbox-label span:hover {
            background: #ffe7d8;
        }

        .day-checkbox-label input:checked+span {
            background: #2a1406;
            color: #ffd7bf;
            border-color: #2a1406;
        }

        #addCourseBtn {
            width: 48px;
            height: 48px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(42, 20, 6, 0.45);
            background: #ffd7bf;
            color: #2a1406;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(42, 20, 6, 0.1);
        }

        #addCourseBtn:hover {
            background: #ffe7d8;
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 14px rgba(42, 20, 6, 0.15);
        }

        .scrollable-form-container {
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            padding-right: 12px;
            margin-bottom: 20px;
        }

        /* Custom scrollbar for form container */
        .scrollable-form-container::-webkit-scrollbar {
            width: 6px;
        }

        .scrollable-form-container::-webkit-scrollbar-track {
            background: rgba(42, 20, 6, 0.05);
            border-radius: 3px;
        }

        .scrollable-form-container::-webkit-scrollbar-thumb {
            background: rgba(42, 20, 6, 0.25);
            border-radius: 3px;
        }

        .scrollable-form-container::-webkit-scrollbar-thumb:hover {
            background: rgba(42, 20, 6, 0.4);
        }

        /* Mobile overrides */
        @media (max-width: 1024px) {
            .schedule-container {
                flex-direction: column;
                height: auto;
            }

            .schedule-right-strips {
                min-height: 80px !important;
                max-height: 100px !important;
                height: 100px !important;
                order: 1;
            }

            .schedule-left-form {
                min-height: 500px;
                padding: 40px 20px;
                order: 2;
            }

            .scrollable-form-container {
                max-height: none;
                overflow-y: visible;
                padding-right: 0;
            }
        }
    </style>
</head>

                            Maximum 8 courses allowed.

                    </div>

                        <span>Continue</span>
                        <span class="btn-icon">→</span>

                            Cancel &amp; Go Back
                        </a>
                    </div>
                    {% endif %}
                </form>

    <script>
        window.existingSchedule = {{ existing_schedule | tojson if existing_schedule is defined else '[]' }};
        (function () {
            const courseRowsContainer = document.getElementById('courseRowsContainer');
            const addCourseBtn = document.getElementById('addCourseBtn');
            const courseScheduleForm = document.getElementById('courseScheduleForm');
            const courseRowTemplate = document.getElementById('courseRowTemplate');

            const MAX_COURSES = 8;
            const ALLOWED_MIN_TIME = '08:00';
            const ALLOWED_MAX_TIME = '18:00';

            function timeToMinutes(value) {
                if (!value || typeof value !== 'string' || !value.includes(':')) {
                    return null;
                }
                const parts = value.split(':');
                const hours = Number(parts[0]);
                const minutes = Number(parts[1]);
                if (!Number.isFinite(hours) || !Number.isFinite(minutes)) {
                    return null;
                }
                return hours * 60 + minutes;
            }

            function isWithinAllowedTime(value) {
                const minutes = timeToMinutes(value);
                const minMinutes = timeToMinutes(ALLOWED_MIN_TIME);
                const maxMinutes = timeToMinutes(ALLOWED_MAX_TIME);
                if (minutes === null || minMinutes === null || maxMinutes === null) {
                    return false;
                }
                return minutes >= minMinutes && minutes <= maxMinutes;
            }

            function updateAddCourseState() {
                const count = courseRowsContainer.querySelectorAll('.course-row-card').length;
                const maxMessage = document.getElementById('maxCoursesMessage');
                if (count >= MAX_COURSES) {
                    addCourseBtn.disabled = true;
                    addCourseBtn.style.opacity = '0.55';
                    addCourseBtn.style.cursor = 'not-allowed';
                    addCourseBtn.title = 'Maximum 8 courses allowed';
                    if (maxMessage) {
                        maxMessage.style.display = 'inline-flex';
                    }
                    return;
                }

                addCourseBtn.disabled = false;
                addCourseBtn.style.opacity = '1';
                addCourseBtn.style.cursor = 'pointer';
                addCourseBtn.title = 'Add another course';
                if (maxMessage) {
                    maxMessage.style.display = 'none';
                }
            }

            function refreshCourseOptions() {
                const cards = Array.from(courseRowsContainer.querySelectorAll('.course-row-card'));
                const selectedValues = new Set();

                cards.forEach(card => {
                    const select = card.querySelector('select[name="course_name"]');
                    if (select && select.value) {
                        selectedValues.add(select.value);
                    }
                });

                cards.forEach(card => {
                    const select = card.querySelector('select[name="course_name"]');
                    if (!select) return;
                    const currentValue = select.value;
                    Array.from(select.options).forEach(option => {
                        if (!option.value) return;
                        option.disabled = option.value !== currentValue && selectedValues.has(option.value);
                    });
                });
            }


            function enableSymbolHover() {
                document.body.classList.add('enable-symbol-hover');
                window.removeEventListener('mousemove', enableSymbolHover);
                window.removeEventListener('touchstart', enableSymbolHover);
            }

            function syncMobileStripLoopDistance() {
                const isMobile = window.matchMedia('(max-width: 1024px)').matches;
                const firstStrip = document.querySelector('.login-illustration .symbols-container:first-child');
                if (!firstStrip) return;

                if (!isMobile) {
                    if (firstStrip.dataset.mobileTickerReady === '1') {
                        if (firstStrip.dataset.originalHtml) {
                            firstStrip.innerHTML = firstStrip.dataset.originalHtml;
                        }
                        firstStrip.dataset.mobileTickerReady = '0';
                    }
                    return;
                }

                if (firstStrip.dataset.mobileTickerReady !== '1') {
                    if (!firstStrip.dataset.originalHtml) {
                        firstStrip.dataset.originalHtml = firstStrip.innerHTML;
                    }
                    const originalSymbols = Array.from(firstStrip.querySelectorAll('.symbol'));
                    if (!originalSymbols.length) return;

                    const baseCount = Math.max(1, Math.floor(originalSymbols.length / 2));
                    const baseMarkup = originalSymbols
                        .slice(0, baseCount)
                        .map(symbol => symbol.outerHTML)
                        .join('');

                    firstStrip.innerHTML = baseMarkup + baseMarkup + baseMarkup;
                    firstStrip.dataset.mobileBaseCount = String(baseCount);
                    firstStrip.dataset.mobileTickerReady = '1';
                }

                const renderedSymbols = Array.from(firstStrip.querySelectorAll('.symbol'));
                if (!renderedSymbols.length) return;

                const baseCount = Number(firstStrip.dataset.mobileBaseCount || '0');
                if (!baseCount) return;

                requestAnimationFrame(function () {
                    let loopDistance = 0;
                    for (let index = 0; index < baseCount; index++) {
                        const currentSymbol = renderedSymbols[index];
                        if (!currentSymbol) break;
                        loopDistance += currentSymbol.getBoundingClientRect().width;
                    }
                    if (loopDistance > 0) {
                        firstStrip.style.setProperty('--mobile-loop-distance', `${loopDistance}px`);
                    }
                });
            }

            window.addEventListener('mousemove', enableSymbolHover, { once: true });
            window.addEventListener('touchstart', enableSymbolHover, { once: true });
            window.addEventListener('load', () => {
                syncMobileStripLoopDistance();
            });

            window.addEventListener('resize', () => {
                syncMobileStripLoopDistance();
            });

            // Update the hidden days field value based on checked checkboxes in a card
            function updateDaysHiddenInput(card) {
                const checked = card.querySelector('.days-checklist input[type="checkbox"]:checked');
                card.querySelector('.days-hidden-input').value = checked ? checked.value : '';
            }

            // Bind change events to validation and days collection
            function bindRowEvents(card) {
                const courseSelect = card.querySelector('select[name="course_name"]');
                const startTimeInput = card.querySelector('select[name="start_time"]');
                const endTimeInput = card.querySelector('select[name="end_time"]');
                const daysCheckboxes = card.querySelectorAll('.days-checklist input[type="checkbox"]');

                courseSelect.addEventListener('change', () => {
                    validateField(courseSelect, card.querySelector('.error-course'), 'Please select a course.');
                    validateNoDuplicateCourses();
                    refreshCourseOptions();
                });
                startTimeInput.addEventListener('change', () => {
                    validateField(startTimeInput, card.querySelector('.error-start'), 'Start time is required.');
                    validateTimeRange(card);
                    validateNoOverlaps();
                });
                endTimeInput.addEventListener('change', () => {
                    validateField(endTimeInput, card.querySelector('.error-end'), 'End time is required.');
                    validateTimeRange(card);
                    validateNoOverlaps();
                });

                daysCheckboxes.forEach(cb => {
                    cb.addEventListener('change', () => {
                        // Allow only one day per course.
                        if (cb.checked) {
                            daysCheckboxes.forEach(other => {
                                if (other !== cb) {
                                    other.checked = false;
                                }
                            });
                        }
                        updateDaysHiddenInput(card);
                        validateDays(card);
                        validateNoOverlaps();
                    });
                });

                const removeBtn = card.querySelector('.remove-course-btn');
                removeBtn.addEventListener('click', () => {
                    card.remove();
                    updateRemoveButtonsVisibility();
                    updateAddCourseState();
                    validateNoOverlaps();
                    validateNoDuplicateCourses();
                    refreshCourseOptions();
                });
            }

            function validateField(input, errorSpan, emptyMsg) {
                if (!input.value) {
                    errorSpan.textContent = emptyMsg;
                    input.closest('.input-wrapper').classList.add('invalid-wrapper');
                    return false;
                }
                errorSpan.textContent = '';
                input.closest('.input-wrapper').classList.remove('invalid-wrapper');
                return true;
            }

            function validateTimeRange(card) {
                const startTimeInput = card.querySelector('select[name="start_time"]');
                const endTimeInput = card.querySelector('select[name="end_time"]');
                const startError = card.querySelector('.error-start');
                const endError = card.querySelector('.error-end');

                if (startTimeInput.value && !isWithinAllowedTime(startTimeInput.value)) {
                    startError.textContent = 'Start time must be between 8:00 AM and 6:00 PM.';
                    startTimeInput.closest('.input-wrapper').classList.add('invalid-wrapper');
                    return false;
                }

                if (endTimeInput.value && !isWithinAllowedTime(endTimeInput.value)) {
                    endError.textContent = 'End time must be between 8:00 AM and 6:00 PM.';
                    endTimeInput.closest('.input-wrapper').classList.add('invalid-wrapper');
                    return false;
                }

                if (startTimeInput.value && endTimeInput.value) {
                    if (startTimeInput.value >= endTimeInput.value) {
                        endError.textContent = 'End time must be after start time.';
                        endTimeInput.closest('.input-wrapper').classList.add('invalid-wrapper');
                        return false;
                    } else {
                        endError.textContent = '';
                        endTimeInput.closest('.input-wrapper').classList.remove('invalid-wrapper');
                    }
                }
                return true;
            }

            function clearOverlapState(card) {
                const overlapError = card.querySelector('.error-overlap');
                if (overlapError) {
                    overlapError.textContent = '';
                }
                const startWrapper = card.querySelector('select[name="start_time"]').closest('.input-wrapper');
                const endWrapper = card.querySelector('select[name="end_time"]').closest('.input-wrapper');
                startWrapper.classList.remove('overlap-invalid');
                endWrapper.classList.remove('overlap-invalid');
            }

            function markOverlap(card, message) {
                const overlapError = card.querySelector('.error-overlap');
                if (overlapError) {
                    overlapError.textContent = message;
                }
                const startWrapper = card.querySelector('select[name="start_time"]').closest('.input-wrapper');
                const endWrapper = card.querySelector('select[name="end_time"]').closest('.input-wrapper');
                startWrapper.classList.add('overlap-invalid');
                endWrapper.classList.add('overlap-invalid');
            }

            function validateNoOverlaps() {
                const cards = Array.from(courseRowsContainer.querySelectorAll('.course-row-card'));
                cards.forEach(clearOverlapState);

                const entries = cards
                    .map((card, index) => {
                        const day = (card.querySelector('.days-hidden-input')?.value || '').trim();
                        const startValue = (card.querySelector('select[name="start_time"]')?.value || '').trim();
                        const endValue = (card.querySelector('select[name="end_time"]')?.value || '').trim();
                        const startMinutes = timeToMinutes(startValue);
                        const endMinutes = timeToMinutes(endValue);
                        return { card, index, day, startMinutes, endMinutes, startValue, endValue };
                    })
                    .filter(e => e.day && e.startMinutes !== null && e.endMinutes !== null);

                let ok = true;
                for (let i = 0; i < entries.length; i++) {
                    for (let j = i + 1; j < entries.length; j++) {
                        const a = entries[i];
                        const b = entries[j];
                        if (a.day !== b.day) continue;
                        // Overlap rule: [start, end) intervals must not intersect.
                        const overlaps = a.startMinutes < b.endMinutes && a.endMinutes > b.startMinutes;
                        if (overlaps) {
                            ok = false;
                            const msg = `Overlapping time on ${a.day}. Please adjust times.`;
                            markOverlap(a.card, msg);
                            markOverlap(b.card, msg);
                        }
                    }
                }
                return ok;
            }

            function validateNoDuplicateCourses() {
                const cards = Array.from(courseRowsContainer.querySelectorAll('.course-row-card'));
                cards.forEach(card => {
                    const courseSelect = card.querySelector('select[name="course_name"]');
                    const errorCourse = card.querySelector('.error-course');
                    if (errorCourse.textContent === 'This course is already added in another row.') {
                        errorCourse.textContent = '';
                        courseSelect.closest('.input-wrapper').classList.remove('invalid-wrapper');
                    }
                });

                const values = cards.map((card, index) => {
                    const select = card.querySelector('select[name="course_name"]');
                    return { card, select, val: select?.value || '', index };
                }).filter(e => e.val);

                let ok = true;
                const counts = {};
                values.forEach(e => {
                    counts[e.val] = (counts[e.val] || 0) + 1;
                });

                values.forEach(e => {
                    if (counts[e.val] > 1) {
                        ok = false;
                        const errorCourse = e.card.querySelector('.error-course');
                        errorCourse.textContent = 'This course is already added in another row.';
                        e.select.closest('.input-wrapper').classList.add('invalid-wrapper');
                    }
                });

                return ok;
            }

            function validateDays(card) {
                const hiddenInput = card.querySelector('.days-hidden-input');
                const daysError = card.querySelector('.error-days');
                if (!hiddenInput.value) {
                    daysError.textContent = 'Please select one day.';
                    return false;
                }
                daysError.textContent = '';
                return true;
            }

            function validateRow(card) {
                const courseSelect = card.querySelector('select[name="course_name"]');
                const startTimeInput = card.querySelector('select[name="start_time"]');
                const endTimeInput = card.querySelector('select[name="end_time"]');

                const isCourseValid = validateField(courseSelect, card.querySelector('.error-course'), 'Please select a course.');
                const isStartValid = validateField(startTimeInput, card.querySelector('.error-start'), 'Start time is required.');
                const isEndValid = validateField(endTimeInput, card.querySelector('.error-end'), 'End time is required.');
                const isRangeValid = validateTimeRange(card);
                const isDaysValid = validateDays(card);

                return isCourseValid && isStartValid && isEndValid && isRangeValid && isDaysValid;
            }

            function updateRemoveButtonsVisibility() {
                const cards = courseRowsContainer.querySelectorAll('.course-row-card');
                cards.forEach(card => {
                    const removeBtn = card.querySelector('.remove-course-btn');
                    if (cards.length > 1) {
                        removeBtn.style.display = 'flex';
                    } else {
                        removeBtn.style.display = 'none';
                    }
                });
            }

            function createNewRow() {
                const currentCount = courseRowsContainer.querySelectorAll('.course-row-card').length;
                if (currentCount >= MAX_COURSES) {
                    updateAddCourseState();
                    return null;
                }
                const clone = courseRowTemplate.content.cloneNode(true);
                const card = clone.querySelector('.course-row-card');
                courseRowsContainer.appendChild(clone);
                bindRowEvents(card);
                updateRemoveButtonsVisibility();
                updateAddCourseState();
                refreshCourseOptions();
                return card;
            }

            // Prefill existing schedule rows if available, else add one empty row
            if (window.existingSchedule && window.existingSchedule.length > 0) {
                window.existingSchedule.forEach(data => {
                    const card = createNewRow();
                    if (card) {
                        const courseSelect = card.querySelector('select[name="course_name"]');
                        if (courseSelect) courseSelect.value = data.course_name;

                        const startTimeInput = card.querySelector('select[name="start_time"]');
                        if (startTimeInput) startTimeInput.value = data.start_time;

                        const endTimeInput = card.querySelector('select[name="end_time"]');
                        if (endTimeInput) endTimeInput.value = data.end_time;

                        const daysCheckboxes = card.querySelectorAll('.days-checklist input[type="checkbox"]');
                        daysCheckboxes.forEach(cb => {
                            if (cb.value === data.days) {
                                cb.checked = true;
                            }
                        });
                        updateDaysHiddenInput(card);
                        refreshCourseOptions();
                    }
                });
            } else {
                createNewRow();
            }
            updateAddCourseState();
            refreshCourseOptions();

            addCourseBtn.addEventListener('click', () => {
                const newCard = createNewRow();
                if (!newCard) {
                    return;
                }
                newCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            courseScheduleForm.addEventListener('submit', (e) => {
                const cards = courseRowsContainer.querySelectorAll('.course-row-card');
                let allValid = true;

                if (cards.length > MAX_COURSES) {
                    allValid = false;
                    updateAddCourseState();
                }

                cards.forEach(card => {
                    const isValid = validateRow(card);
                    if (!isValid) {
                        allValid = false;
                    }
                });

                if (!validateNoOverlaps()) {
                    allValid = false;
                }

                if (!validateNoDuplicateCourses()) {
                    allValid = false;
                }

                refreshCourseOptions();

                if (!allValid) {
                    e.preventDefault();
                    // Scroll to the first invalid field/card
                    const firstInvalid = courseRowsContainer.querySelector('.invalid-wrapper, .overlap-invalid, .error-days:not(:empty), .error-overlap:not(:empty)');
                    if (firstInvalid) {
                        firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });

        })();
    </script>
</body>

</html>
